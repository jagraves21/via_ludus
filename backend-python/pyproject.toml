# pip install -e ".[test,notebooks,webservice]"
# pip install -e ".[graph-agents]"
# pip install -e ".[progress,visualization,dataframe]"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "via-ludus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"numpy",
]

[project.optional-dependencies]
test = [
	"pytest",
]

progress = [
	"tqdm",
]

visualization = [
	"matplotlib",
]

dataframe = [
	"pandas",
]

graph-agents = [
	"networkx",
	"scipy",
]

notebooks = [
	"jupyter",
	"tqdm",
	"matplotlib",
	"pandas",
]

webservice = [
	"fastapi",
	"uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

