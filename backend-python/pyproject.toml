[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "via-ludus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"numpy",
]

[project.optional-dependencies]
progress = [
	"tqdm",
]

visualization = [
	"matplotlib",
]

dataframe = [
	"pandas",
]

graph-agents = [
	"networkx",
	"scipy",
]

notebooks = [
	"jupyter",
	"tqdm",
	"matplotlib",
	"pandas",
]

webservice = [
	"fastapi",
	"uvicorn",
]

test = [
	"pytest",
	"pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

